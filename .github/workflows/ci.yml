name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-retries 30
    defaults:
      run:
        working-directory: 2fauth-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 2fauth-go/go.mod
          cache-dependency-path: 2fauth-go/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_PGSQL_DSN: postgres://postgres:test@127.0.0.1:5432/test?sslmode=disable
          TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/test?parseTime=true&charset=utf8mb4&loc=UTC
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2fauth-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2fauth-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --audit-level=moderate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t 2fauth .
